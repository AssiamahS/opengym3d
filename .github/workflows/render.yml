name: render & deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  BLENDER_VERSION: 4.5.11
  # écorché exports the atlas lying flat (Z-up vs Y-up, see NOTES.md 2026-07-27)
  # and ships blank renders. Pin the v0.22 figure until the axis fix lands.
  FITX_ECORCHE: "0"

jobs:
  # Fast gate: the spec/manifest bugs that waste a 40-minute render (a muscle
  # the painter can't paint, an unsorted rep, equipment with no prop) are all
  # plain data, so catch them in seconds before Blender is ever downloaded.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -v

  render:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Mixamo motions (exported Without Skin) live in a private repo: Adobe's
      # Mixamo terms allow them inside a project but not as redistributed
      # files, so the public repo only carries the references.
      - uses: actions/checkout@v4
        with:
          repository: AssiamahS/opengym3d-mocap
          token: ${{ secrets.MOCAP_TOKEN }}
          path: mocap

      - name: Cache Blender
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: ~/blender
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64

      - name: Install Blender
        if: steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          curl -sL "https://download.blender.org/release/Blender4.5/blender-${BLENDER_VERSION}-linux-x64.tar.xz" | tar xJ -C "$HOME"
          mv "$HOME/blender-${BLENDER_VERSION}-linux-x64" "$HOME/blender"

      - name: Install runtime libs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libxkbcommon0 libsm6 ffmpeg

      - name: Cache MPFB extension
        uses: actions/cache@v4
        with:
          path: ~/.config/blender/4.5/extensions
          key: mpfb-2.0.16

      # 87 MB zip -> 307 MB .blend. Cached, it costs one download ever.
      - name: Cache Z-Anatomy atlas
        uses: actions/cache@v4
        with:
          path: ~/z-anatomy
          key: z-anatomy-master-2024-01-18

      - name: Download MPFB zip
        run: |
          if [ ! -d "$HOME/.config/blender/4.5/extensions/user_default/mpfb" ]; then
            curl -sL -o /tmp/mpfb.zip "https://extensions.blender.org/download/sha256:b5cdc8b08147e0c6463e4faa01147491b13a0b062f73415363f029debd11c934/add-on-mpfb-v2.0.16.zip?repository=%2Fapi%2Fv1%2Fextensions%2F&blender_version_min=4.2.0"
          fi

      - name: Render exercises to GLB + thumbnails
        run: |
          mkdir -p site/assets
          for spec in $(python3 pipeline/list_specs.py exercises); do
            echo "=== $spec"
            "$HOME/blender/blender" -b -noaudio --python-exit-code 1 -P pipeline/build_exercise.py -- "$spec" site/assets
          done
          ls -la site/assets
          for spec in $(python3 pipeline/list_specs.py exercises); do
            id=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['id'])" "$spec")
            test -s "site/assets/$id.glb" || { echo "missing $id.glb"; exit 1; }
            test -s "site/assets/$id.png" || { echo "missing $id.png"; exit 1; }
          done

      # The GLB is what the viewer plays, so grade the GLB: joint lengths,
      # hinge angles, roll flips, pops, foot slide, implement contact, loop.
      # Reports sit next to the assets for the inspector page; the manifest
      # step reads them and drops any exercise with a critical failure.
      - name: Joint-integrity QA
        run: python3 pipeline/qa_glb.py site/assets/*.glb || echo "::warning::QA failures above — those exercises are excluded from the manifest"

      - name: Assemble watch GIFs + MP4s + frame strips
        run: |
          for dir in site/assets/frames_*; do
            id=$(basename "$dir" | sed 's/^frames_//')
            # 12-frame contact sheet across the whole rep: start, load,
            # transition, peak, drive, finish, loop — the thumbnail alone hides
            # every mid-rep failure
            cnt=$(ls "$dir"/*.png | wc -l)
            pick=$(python3 -c "import sys; n=int(sys.argv[1]); print('+'.join('eq(n'+chr(92)+',%d)' % round(i*(n-1)/11) for i in range(12)))" "$cnt")
            ffmpeg -v error -pattern_type glob -i "$dir/*.png" \
              -vf "select='$pick',scale=180:-1,tile=12x1:padding=2:color=0x0b0d10" \
              -frames:v 1 "site/assets/$id.strip.png"
            ffmpeg -v error -framerate 15 -pattern_type glob -i "$dir/*.png" \
              -vf "split[a][b];[a]palettegen=max_colors=128[p];[b][p]paletteuse=dither=bayer" \
              "site/assets/$id.gif"
            ffmpeg -v error -framerate 15 -pattern_type glob -i "$dir/*.png" \
              -c:v libx264 -pix_fmt yuv420p -movflags +faststart "site/assets/$id.mp4"
            rm -rf "$dir"
            test -s "site/assets/$id.gif" || { echo "missing $id.gif"; exit 1; }
            test -s "site/assets/$id.strip.png" || { echo "missing $id.strip.png"; exit 1; }
          done
          ls -la site/assets

      - name: Assemble site
        run: |
          cp -r website/* site/
          python3 pipeline/make_manifest.py exercises site/exercises.json site/assets
          cat site/qa_report.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: render
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
