name: spike

# One exercise, one picture, fast. The full render is 38 minutes across 24
# exercises — far too slow a loop for "does the figure look right yet".

on:
  workflow_dispatch:
    inputs:
      exercise:
        description: exercise id to render
        default: squat
  push:
    paths:
      - pipeline/ecorche.py
      - pipeline/build_exercise.py
      - exercises/**
      - .github/workflows/spike.yml

env:
  BLENDER_VERSION: 4.5.11

jobs:
  spike:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: AssiamahS/opengym3d-mocap
          token: ${{ secrets.MOCAP_TOKEN }}
          path: mocap

      - name: Cache Blender
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: ~/blender
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64

      - name: Install Blender
        if: steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          curl -sL "https://download.blender.org/release/Blender4.5/blender-${BLENDER_VERSION}-linux-x64.tar.xz" | tar xJ -C "$HOME"
          mv "$HOME/blender-${BLENDER_VERSION}-linux-x64" "$HOME/blender"

      - name: Cache MPFB extension
        uses: actions/cache@v4
        with:
          path: ~/.config/blender/4.5/extensions
          key: mpfb-2.0.16

      - name: Download MPFB zip
        run: |
          if [ ! -d "$HOME/.config/blender/4.5/extensions/user_default/mpfb" ]; then
            curl -sL -o /tmp/mpfb.zip "https://extensions.blender.org/download/sha256:b5cdc8b08147e0c6463e4faa01147491b13a0b062f73415363f029debd11c934/add-on-mpfb-v2.0.16.zip?repository=%2Fapi%2Fv1%2Fextensions%2F&blender_version_min=4.2.0"
          fi

      - name: Install runtime libs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libxkbcommon0 libsm6

      - name: Render one exercise
        env:
          FITX_ECORCHE: "0"
        run: |
          ex="${{ github.event.inputs.exercise || 'squat' }}"
          "$HOME/blender/blender" -b -noaudio --python-exit-code 1 \
            -P pipeline/build_exercise.py -- "exercises/$ex.json" spike_out
          ls -la spike_out

      # Grade the spike the way the deploy would, and leave the frame strip
      # in the artifact: a spike that "passes" is one whose joints pass.
      - name: Joint-integrity QA + frame strip
        if: always()
        run: |
          python3 pipeline/qa_glb.py spike_out/*.glb || echo "::warning::QA FAIL — see table above"
          sudo apt-get install -y -qq ffmpeg
          for dir in spike_out/frames_*; do
            id=$(basename "$dir" | sed 's/^frames_//')
            cnt=$(ls "$dir"/*.png | wc -l)
            every=$(( (cnt + 11) / 12 ))
            ffmpeg -v error -pattern_type glob -i "$dir/*.png" \
              -vf "select='not(mod(n\,$every))',scale=180:-1,tile=12x1:padding=2:color=0x0b0d10" \
              -frames:v 1 "spike_out/$id.strip.png"
            rm -rf "$dir"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike
          path: spike_out
